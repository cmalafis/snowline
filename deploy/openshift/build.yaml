# Binary Docker build in the cluster: scripts/deploy-openshift.sh uploads the source and the cluster builds the image.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: snowline
  labels: { app: snowline }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: snowline
  labels: { app: snowline }
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: snowline:latest
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "2", memory: 6Gi }
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
